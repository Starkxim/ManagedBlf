name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [net8.0, net10.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build src/ManagedBlf/ManagedBlf.csproj -c Release -f ${{ matrix.framework }}
      - run: dotnet test tests/ManagedBlf.Tests/ManagedBlf.Tests.csproj -c Release -f ${{ matrix.framework }} --logger "trx;LogFileName=regression.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.framework }}
          path: tests/ManagedBlf.Tests/TestResults/*.trx
  viewer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build samples/ManagedBlf.Viewer/ManagedBlf.Viewer.csproj -c Release
      - name: Package contents and startup smoke (no release)
        shell: pwsh
        run: ./scripts/package-viewer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-alpha-preview
          path: |
            artifacts/viewer/*.zip
            artifacts/viewer/SHA256SUMS.txt
